<svg width="280" height="100" viewBox="0 0 280 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with construction image -->
  <defs>
    <pattern id="buildingBg" x="0" y="0" width="280" height="100" patternUnits="userSpaceOnUse">
      <image href="/2015/80261A1E-C3C1-4C0D-8F64-AB879C8CE10F_1_105_c.jpeg" x="0" y="0" width="280" height="100" preserveAspectRatio="xMidYMid slice" opacity="0.08"/>
    </pattern>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8F1F5;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.98" />
    </linearGradient>
  </defs>

  <!-- Background rectangle with gradient and building image -->
  <rect width="280" height="100" fill="url(#bgGradient)" rx="8"/>
  <rect width="280" height="100" fill="url(#buildingBg)" rx="8"/>

  <!-- Building icon -->
  <g id="building">
    <!-- Main building structure with brick texture -->
    <rect x="15" y="30" width="45" height="50" fill="#8B4236" rx="2"/>
    <rect x="15" y="30" width="45" height="50" fill="#A0503C" opacity="0.7" rx="2"/>

    <!-- Brick pattern lines -->
    <line x1="15" y1="37" x2="60" y2="37" stroke="#8B4236" stroke-width="0.5"/>
    <line x1="15" y1="44" x2="60" y2="44" stroke="#8B4236" stroke-width="0.5"/>
    <line x1="15" y1="51" x2="60" y2="51" stroke="#8B4236" stroke-width="0.5"/>
    <line x1="15" y1="58" x2="60" y2="58" stroke="#8B4236" stroke-width="0.5"/>
    <line x1="15" y1="65" x2="60" y2="65" stroke="#8B4236" stroke-width="0.5"/>
    <line x1="15" y1="72" x2="60" y2="72" stroke="#8B4236" stroke-width="0.5"/>

    <!-- Windows -->
    <rect x="21" y="36" width="9" height="9" fill="#4A7C9C" rx="1"/>
    <rect x="39" y="36" width="9" height="9" fill="#4A7C9C" rx="1"/>
    <rect x="21" y="49" width="9" height="9" fill="#4A7C9C" rx="1"/>
    <rect x="39" y="49" width="9" height="9" fill="#4A7C9C" rx="1"/>
    <rect x="21" y="62" width="9" height="9" fill="#4A7C9C" rx="1"/>
    <rect x="39" y="62" width="9" height="9" fill="#4A7C9C" rx="1"/>

    <!-- Door -->
    <rect x="30" y="70" width="13" height="10" fill="#2C3E50" rx="1"/>

    <!-- Roof accent -->
    <path d="M 12 30 L 37.5 18 L 63 30" stroke="#2C3E50" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text content -->
  <g id="text">
    <!-- BRF text -->
    <text x="75" y="38" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2C5F7C">BRF</text>

    <!-- Österport 1 -->
    <text x="75" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1A3A4D">Österport 1</text>

    <!-- Västerås -->
    <text x="75" y="78" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#4A6B7C" letter-spacing="0.5">Västerås</text>
  </g>
</svg>
